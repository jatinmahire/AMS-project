services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams_password}
      POSTGRES_DB: ${POSTGRES_DB:-ams_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ams_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ams_user}:${POSTGRES_PASSWORD:-ams_password}@postgres:5432/${POSTGRES_DB:-ams_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${SERVER_PORT:-5000}:5000"

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-3000}:80"

volumes:
  postgres_data:
  uploads_data:
